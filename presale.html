<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080711">
<title>QX Presale</title>

<style>
:root{
  --bg:#070510;
  --panel:#120b21;
  --line:#5d3b91;
  --text:#fffaff;
  --muted:#aaa0b8;
  --accent:#b66cff;
  --accent2:#7b35d9;
  --danger:#ff5c7a;
  --success:#4ade80;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  padding:24px 16px 40px;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:100%;
  max-width:520px;
  margin:0 auto;
}

.card{
  background:
    linear-gradient(180deg,rgba(24,14,43,.98),rgba(10,6,20,.98));
  border:1px solid rgba(182,108,255,.35);
  border-radius:24px;
  padding:24px;
  box-shadow:
    0 20px 70px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:3px;
  color:#fff;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:24px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.label{
  color:var(--muted);
  font-size:13px;
}

.value{
  font-weight:700;
}

.balance{
  margin:18px 0;
  padding:16px;
  border:1px solid rgba(182,108,255,.2);
  border-radius:16px;
  background:rgba(255,255,255,.025);
}

.balance-value{
  margin-top:6px;
  font-size:24px;
  font-weight:900;
}

.wallet-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px 16px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#8d42d9,#b66cff);
  box-shadow:0 8px 30px rgba(157,76,230,.25);
}

.wallet-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.wallet-status{
  margin-top:10px;
  min-height:20px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  word-break:break-word;
}

.section{
  margin-top:22px;
}

.input-wrap{
  position:relative;
}

.input{
  width:100%;
  border:1px solid rgba(182,108,255,.3);
  outline:none;
  background:#090611;
  color:white;
  border-radius:14px;
  padding:15px 62px 15px 15px;
}

.input:focus{
  border-color:var(--accent);
}

.input-unit{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-weight:800;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.quick button{
  border:1px solid rgba(182,108,255,.25);
  background:#100a1d;
  color:#ddd2e8;
  border-radius:10px;
  padding:9px 5px;
  font-size:12px;
  font-weight:800;
}

.quick button:hover{
  border-color:var(--accent);
  color:white;
}

.price-box{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:rgba(182,108,255,.07);
  border:1px solid rgba(182,108,255,.15);
}

.price-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:7px 0;
  font-size:13px;
}

.price-row span:first-child{
  color:var(--muted);
}

.buy-btn{
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:15px;
  padding:16px;
  color:white;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(135deg,#7b35d9,#b66cff);
  box-shadow:0 12px 35px rgba(151,67,224,.3);
}

.buy-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  display:none;
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}

.message.show{
  display:block;
}

.message.error{
  color:#ffd4dc;
  border:1px solid rgba(255,92,122,.3);
  background:rgba(255,92,122,.08);
}

.message.success{
  color:#c9ffd9;
  border:1px solid rgba(74,222,128,.3);
  background:rgba(74,222,128,.08);
}

.notice{
  margin-top:20px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
  text-align:center;
}

a{
  color:#c89aff;
}

.lang{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:20px;
}

.lang button{
  border:1px solid rgba(182,108,255,.2);
  background:transparent;
  color:var(--muted);
  border-radius:8px;
  padding:6px 10px;
  font-size:11px;
}

.lang button.active{
  color:white;
  border-color:var(--accent);
}
</style>

     buffer@6.0.3 exposes the Buffer implementation through window.buffer.
     We explicitly assign the actual Buffer constructor, not the whole module.
-->

<script>
(function(){
  try{
    if(
      typeof window.Buffer === "undefined" &&
      window.buffer &&
      window.buffer.Buffer
    ){
      window.Buffer = window.buffer.Buffer;
    }

    if(
      !window.Buffer ||
      typeof window.Buffer.from !== "function"
    ){
      throw new Error("Buffer.from is unavailable");
    }

    console.log("QX Buffer ready:", typeof window.Buffer.from);
  }catch(e){
    console.error("QX Buffer initialization failed:",e);
  }
})();
</script>

<script>
"use strict";

/* =========================================================
   QX PRESALE CONFIG
========================================================= */

const RECEIVE_WALLET =
  "E4x2DiVVDuQHSUGgzTPjJMDbiJ6jCRwpEvsvAd31Qs4";

const QX_PRICE_USD = 0.0002;

const PRICE_URL =
  "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd";

const RPC_ENDPOINTS = [
  "https://api.mainnet-beta.solana.com",
  "https://solana-rpc.publicnode.com"
];

const PRESALE_END =
  new Date("2026-11-15T01:45:00+04:00").getTime();

/* =========================================================
   STATE
========================================================= */

let currentLanguage = "en";
let walletProvider = null;
let walletPublicKey = null;
let solPrice = 0;
let isBuying = false;

/* =========================================================
   I18N
========================================================= */

const I18N = {
  en:{
    subtitle:"QX Presale",
    walletLabel:"Solana Wallet",
    connected:"Connected",
    disconnected:"Not connected",
    connect:"Connect Wallet",
    connecting:"Connecting...",
    amount:"Amount of SOL",
    solPrice:"SOL Price",
    usdValue:"USD Value",
    qxAmount:"QX Amount",
    buy:"Buy QX",
    buying:"Processing payment...",
    notice:"Your SOL payment will be sent to the official QX presale receiving wallet. QX tokens are distributed according to the presale terms.",
    success:"Payment sent successfully.",
    walletRequired:"Please connect your Solana wallet first.",
    invalidAmount:"Enter a valid SOL amount.",
    rpcError:"Unable to connect to the Solana network.",
    transactionFailed:"Payment failed",
    walletRejected:"Transaction was rejected or cancelled in the wallet.",
    bufferError:"Browser wallet library initialization failed.",
    priceError:"Unable to load SOL price."
  },

  ar:{
    subtitle:"البيع المسبق لـ QX",
    walletLabel:"محفظة سولانا",
    connected:"متصلة",
    disconnected:"غير متصلة",
    connect:"ربط المحفظة",
    connecting:"جاري ربط المحفظة...",
    amount:"كمية SOL",
    solPrice:"سعر SOL",
    usdValue:"القيمة بالدولار",
    qxAmount:"كمية QX",
    buy:"شراء QX",
    buying:"جاري تنفيذ الدفع...",
    notice:"سيتم إرسال دفعة SOL إلى محفظة الاستقبال الرسمية للبيع المسبق لـ QX. سيتم توزيع عملات QX وفقاً لشروط البيع المسبق.",
    success:"تم إرسال الدفع بنجاح.",
    walletRequired:"يرجى ربط محفظة سولانا أولاً.",
    invalidAmount:"أدخل كمية SOL صحيحة.",
    rpcError:"تعذر الاتصال بشبكة سولانا.",
    transactionFailed:"فشل الدفع",
    walletRejected:"تم رفض العملية أو إلغاؤها من المحفظة.",
    bufferError:"تعذر تهيئة مكتبة المحفظة في المتصفح.",
    priceError:"تعذر تحميل سعر SOL."
  }
};

/* =========================================================
   HELPERS
========================================================= */

function t(key){
  return I18N[currentLanguage][key] || key;
}

function showMessage(text,type="error"){
  const el = document.getElementById("message");

  el.textContent = text;
  el.className = "message show " + type;
}

function hideMessage(){
  const el = document.getElementById("message");
  el.className = "message";
  el.textContent = "";
}

function shortAddress(address){
  if(!address) return "";
  return address.slice(0,4) + "..." + address.slice(-4);
}

function getProvider(){
  /*
   * First preference:
   * The main QX page already owns the wallet connection.
   * The presale iframe should use that parent wallet bridge.
   */

  try{
    if(
      window.parent !== window &&
      typeof window.parent.QXSendPresaleTransaction === "function"
    ){
      return {
        type:"parent-bridge"
      };
    }
  }catch(e){}

  /*
   * Standalone fallback.
   */

  if(
    window.phantom &&
    window.phantom.solana
  ){
    return window.phantom.solana;
  }

  if(
    window.solflare
  ){
    return window.solflare;
  }

  if(
    window.backpack &&
    window.backpack.solana
  ){
    return window.backpack.solana;
  }

  if(
    window.solana
  ){
    return window.solana;
  }

  return null;
}

/* =========================================================
   RPC
========================================================= */

async function getConnection(){
  let lastError = null;

  for(const endpoint of RPC_ENDPOINTS){

    try{

      const connection =
        new solanaWeb3.Connection(
          endpoint,
          {
            commitment:"confirmed",
            confirmTransactionInitialTimeout:60000
          }
        );

      await connection.getLatestBlockhash("confirmed");

      return connection;

    }catch(error){
      lastError = error;
    }
  }

  throw lastError || new Error(t("rpcError"));
}

/* =========================================================
   WALLET
========================================================= */

async function connectWallet(){

  hideMessage();

  const button =
    document.getElementById("walletBtn");

  const status =
    document.getElementById("walletStatus");

  button.disabled = true;
  button.textContent = t("connecting");

  status.textContent = t("connecting");

  try{

    /*
     * IMPORTANT:
     * If this page is inside the QX iframe,
     * let the main QX page handle wallet connection.
     */

    if(
      window.parent !== window &&
      typeof window.parent.QXConnectWallet === "function"
    ){

      await window.parent.QXConnectWallet();

      /*
       * Give the parent a moment to finish setting
       * the active provider.
       */
      await new Promise(
        resolve => setTimeout(resolve,700)
      );

      walletProvider = getProvider();

      walletPublicKey = null;

      if(
        walletProvider &&
        walletProvider.type === "parent-bridge"
      ){

        document.getElementById("walletState")
          .textContent = t("connected");

        status.textContent =
          "QX wallet connected";

        await loadBalanceFromParent();

        button.textContent = t("connected");

        return;
      }
    }

    /*
     * Standalone direct-wallet fallback.
     */

    walletProvider = getProvider();

    if(
      !walletProvider ||
      walletProvider.type === "parent-bridge"
    ){

      throw new Error(
        "No compatible Solana wallet found."
      );
    }

    let result =
      await walletProvider.connect();

    walletPublicKey =
      result?.publicKey ||
      walletProvider.publicKey;

    if(!walletPublicKey){
      throw new Error(
        "Wallet connected but no public key was returned."
      );
    }

    const address =
      walletPublicKey.toString();

    document.getElementById("walletState")
      .textContent =
      shortAddress(address);

    status.textContent =
      address;

    button.textContent =
      t("connected");

    await loadBalance();

  }catch(error){

    console.error("Wallet connection error:",error);

    walletProvider = null;
    walletPublicKey = null;

    document.getElementById("walletState")
      .textContent =
      t("disconnected");

    status.textContent =
      error?.message || "Wallet connection failed";

    button.textContent =
      t("connect");

    showMessage(
      error?.message || "Wallet connection failed",
      "error"
    );

  }finally{

    button.disabled = false;
  }
}

/* =========================================================
   PARENT BALANCE
========================================================= */

async function loadBalanceFromParent(){

  try{

    /*
     * We don't need the balance to execute the transaction.
     * If parent exposes a wallet provider, we can attempt
     * to read the public key.
     */

    let parentProvider = null;

    try{
      parentProvider =
        window.parent.getActiveWalletProvider?.();
    }catch(e){}

    if(
      parentProvider &&
      parentProvider.publicKey
    ){

      walletPublicKey =
        parentProvider.publicKey;

      const address =
        walletPublicKey.toString();

      document.getElementById("walletState")
        .textContent =
        shortAddress(address);

      await loadBalance();
      return;
    }

    /*
     * If the parent does not expose its provider publicly,
     * keep the wallet as connected through the QX bridge.
     */
    document.getElementById("walletState")
      .textContent =
      t("connected");

  }catch(error){

    console.warn(
      "Parent wallet balance unavailable:",
      error
    );

  }
}

/* =========================================================
   BALANCE
========================================================= */

async function loadBalance(){

  if(!walletPublicKey){
    return;
  }

  try{

    const connection =
      await getConnection();

    const lamports =
      await connection.getBalance(
        walletPublicKey,
        "confirmed"
      );

    const balance =
      lamports / solanaWeb3.LAMPORTS_PER_SOL;

    document.getElementById("solBalance")
      .textContent =
      balance.toFixed(4);

  }catch(error){

    console.warn(
      "Balance loading failed:",
      error
    );

  }
}

/* =========================================================
   PRICE
========================================================= */

async function loadSolPrice(){

  try{

    const response =
      await fetch(
        PRICE_URL,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error("Price request failed");
    }

    const data =
      await response.json();

    solPrice =
      Number(
        data?.solana?.usd || 0
      );

    if(!solPrice){
      throw new Error("Invalid SOL price");
    }

    document.getElementById("solPrice")
      .textContent =
      "$" + solPrice.toFixed(2);

    updateQuote();

  }catch(error){

    document.getElementById("solPrice")
      .textContent =
      "Unavailable";

    console.warn(
      t("priceError"),
      error
    );
  }
}

/* =========================================================
   QUOTE
========================================================= */

function updateQuote(){

  const amount =
    Number(
      document.getElementById("solAmount").value
    );

  if(!amount || amount <= 0){

    document.getElementById("usdValue")
      .textContent =
      "$0.00";

    document.getElementById("qxAmount")
      .textContent =
      "0 QX";

    return;
  }

  const usd =
    amount * solPrice;

  const qx =
    usd / QX_PRICE_USD;

  document.getElementById("usdValue")
    .textContent =
    "$" + usd.toFixed(2);

  document.getElementById("qxAmount")
    .textContent =
    qx.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:2
      }
    ) + " QX";
}

/* =========================================================
   QUICK AMOUNTS
========================================================= */

async function setPercent(percent){

  try{

    let balance = 0;

    const balanceText =
      document.getElementById("solBalance")
        .textContent;

    balance =
      Number(balanceText);

    if(!balance || balance <= 0){

      if(walletPublicKey){

        await loadBalance();

        balance =
          Number(
            document.getElementById("solBalance")
              .textContent
          );
      }
    }

    if(!balance || balance <= 0){
      showMessage(
        t("walletRequired"),
        "error"
      );
      return;
    }

    /*
     * Keep a small amount for network fees.
     */
    const spendable =
      Math.max(
        0,
        balance - 0.01
      );

    const amount =
      spendable * (percent / 100);

    document.getElementById("solAmount")
      .value =
      amount.toFixed(4);

    updateQuote();

  }catch(error){

    console.error(error);

  }
}

/* =========================================================
   SEND THROUGH QX PARENT BRIDGE
========================================================= */

async function sendThroughQXBridge(transaction){

  if(
    window.parent !== window &&
    typeof window.parent.QXSendPresaleTransaction === "function"
  ){

    return await window.parent.QXSendPresaleTransaction(
      transaction
    );
  }

  throw new Error(
    "QX wallet bridge is unavailable."
  );
}

/* =========================================================
   DIRECT FALLBACK TRANSACTION
========================================================= */

async function sendDirectTransaction(transaction){

  if(
    !walletProvider ||
    typeof walletProvider.signTransaction !== "function"
  ){

    throw new Error(
      "Connected wallet does not support transaction signing."
    );
  }

  const connection =
    await getConnection();

  const signed =
    await walletProvider.signTransaction(
      transaction
    );

  const raw =
    signed.serialize();

  const signature =
    await connection.sendRawTransaction(
      raw,
      {
        skipPreflight:false,
        preflightCommitment:"confirmed",
        maxRetries:3
      }
    );

  await connection.confirmTransaction(
    signature,
    "confirmed"
  );

  return signature;
}

/* =========================================================
   BUY QX
========================================================= */

async function buyQX(){

  if(isBuying){
    return;
  }

  hideMessage();

  const amount =
    Number(
      document.getElementById("solAmount").value
    );

  if(!amount || amount <= 0){

    showMessage(
      t("invalidAmount"),
      "error"
    );

    return;
  }

  if(
    !solanaWeb3 ||
    !solanaWeb3.Transaction
  ){

    showMessage(
      "Solana library failed to load.",
      "error"
    );

    return;
  }

  if(
    !window.Buffer ||
    typeof window.Buffer.from !== "function"
  ){

    showMessage(
      t("bufferError"),
      "error"
    );

    console.error(
      "Buffer.from is unavailable:",
      window.Buffer
    );

    return;
  }

  isBuying = true;

  const button =
    document.getElementById("buyBtn");

  button.disabled = true;
  button.textContent = t("buying");

  try{

    /*
     * Make sure wallet is connected.
     */

    if(
      !walletProvider
    ){

      if(
        window.parent !== window &&
        typeof window.parent.QXConnectWallet === "function"
      ){

        await window.parent.QXConnectWallet();

        await new Promise(
          resolve => setTimeout(resolve,700)
        );

      }else{

        await connectWallet();
      }
    }

    const lamports =
      Math.floor(
        amount *
        solanaWeb3.LAMPORTS_PER_SOL
      );

    if(lamports <= 0){
      throw new Error(
        "Invalid SOL amount."
      );
    }

    const recipient =
      new solanaWeb3.PublicKey(
        RECEIVE_WALLET
      );

    /*
     * Parent bridge architecture:
     *
     * The main QX page owns the actual wallet connection.
     * We create the transaction here and send the Transaction
     * object to QXSendPresaleTransaction().
     */

    if(
      window.parent !== window &&
      typeof window.parent.QXSendPresaleTransaction === "function"
    ){

      let payer = null;

      try{

        const parentProvider =
          window.parent.getActiveWalletProvider?.();

        if(
          parentProvider &&
          parentProvider.publicKey
        ){
          payer =
            parentProvider.publicKey;
        }

      }catch(e){}

      /*
       * If the parent does not expose the provider,
       * use the wallet public key already known to this page.
       */
      if(!payer && walletPublicKey){
        payer = walletPublicKey;
      }

      if(!payer){

        /*
         * The QX parent wallet must be connected first.
         */
        await window.parent.QXConnectWallet();

        await new Promise(
          resolve => setTimeout(resolve,700)
        );

        try{

          const parentProvider =
            window.parent.getActiveWalletProvider?.();

          if(
            parentProvider &&
            parentProvider.publicKey
          ){
            payer =
              parentProvider.publicKey;
          }

        }catch(e){}
      }

      if(!payer){

        throw new Error(
          "Wallet is connected but its public key is unavailable."
        );
      }

      const connection =
        await getConnection();

      const { blockhash } =
        await connection.getLatestBlockhash(
          "confirmed"
        );

      const transaction =
        new solanaWeb3.Transaction();

      transaction.recentBlockhash =
        blockhash;

      transaction.feePayer =
        payer;

      transaction.add(
        solanaWeb3.SystemProgram.transfer({
          fromPubkey:payer,
          toPubkey:recipient,
          lamports:lamports
        })
      );

      const signature =
        await sendThroughQXBridge(
          transaction
        );

      showSuccess(
        signature
      );

      await loadBalance();

      return;
    }

    /*
     * Standalone fallback.
     */

    if(
      !walletPublicKey &&
      walletProvider?.publicKey
    ){

      walletPublicKey =
        walletProvider.publicKey;
    }

    if(!walletPublicKey){

      throw new Error(
        t("walletRequired")
      );
    }

    const connection =
      await getConnection();

    const { blockhash } =
      await connection.getLatestBlockhash(
        "confirmed"
      );

    const transaction =
      new solanaWeb3.Transaction();

    transaction.recentBlockhash =
      blockhash;

    transaction.feePayer =
      walletPublicKey;

    transaction.add(
      solanaWeb3.SystemProgram.transfer({
        fromPubkey:walletPublicKey,
        toPubkey:recipient,
        lamports:lamports
      })
    );

    const signature =
      await sendDirectTransaction(
        transaction
      );

    showSuccess(
      signature
    );

    await loadBalance();

  }catch(error){

    console.error(
      "QX payment error:",
      error
    );

    let message =
      error?.message ||
      String(error);

    if(
      message.includes("User rejected") ||
      message.includes("rejected") ||
      message.includes("denied") ||
      message.includes("cancelled")
    ){

      message =
        t("walletRejected");

    }

    showMessage(
      t("transactionFailed") +
      ": " +
      message,
      "error"
    );

  }finally{

    isBuying = false;

    button.disabled = false;
    button.textContent = t("buy");
  }
}

/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(signature){

  const explorer =
    "https://solscan.io/tx/" +
    encodeURIComponent(signature);

  const text =
    t("success") +
    "\n\nSignature:\n" +
    signature;

  showMessage(
    text,
    "success"
  );

  const box =
    document.getElementById("message");

  box.innerHTML =
    t("success") +
    "<br><br>" +
    '<a href="' +
    explorer +
    '" target="_blank" rel="noopener noreferrer">' +
    "View transaction on Solscan" +
    "</a>";
}

/* =========================================================
   LANGUAGE
========================================================= */

function setLanguage(lang){

  currentLanguage =
    lang === "ar"
      ? "ar"
      : "en";

  const isArabic =
    currentLanguage === "ar";

  document.documentElement.lang =
    currentLanguage;

  document.documentElement.dir =
    isArabic ? "rtl" : "ltr";

  document.getElementById("subtitle")
    .textContent =
    t("subtitle");

  document.getElementById("walletLabel")
    .textContent =
    t("walletLabel");

  document.getElementById("amountLabel")
    .textContent =
    t("amount");

  document.getElementById("solPriceLabel")
    .textContent =
    t("solPrice");

  document.getElementById("usdLabel")
    .textContent =
    t("usdValue");

  document.getElementById("qxReceiveLabel")
    .textContent =
    t("qxAmount");

  document.getElementById("notice")
    .textContent =
    t("notice");

  const connected =
    document.getElementById("walletState")
      .textContent;

  if(
    connected === "Not connected" ||
    connected === "غير متصلة"
  ){

    document.getElementById("walletState")
      .textContent =
      t("disconnected");
  }

  const button =
    document.getElementById("walletBtn");

  if(!button.disabled){
    button.textContent =
      walletProvider
        ? t("connected")
        : t("connect");
  }

  if(!isBuying){
    document.getElementById("buyBtn")
      .textContent =
      t("buy");
  }

  document.getElementById("enBtn")
    .classList.toggle(
      "active",
      !isArabic
    );

  document.getElementById("arBtn")
    .classList.toggle(
      "active",
      isArabic
    );
}

/* =========================================================
   INIT
========================================================= */

window.addEventListener(
  "load",
  async function(){

    setLanguage("en");

    /*
     * Final Buffer verification.
     */
    console.log(
      "QX Buffer.from:",
      typeof window.Buffer?.from
    );

    if(
      !window.Buffer ||
      typeof window.Buffer.from !== "function"
    ){

      console.error(
        "QX ERROR: Buffer.from is still unavailable."
      );

    }

    await loadSolPrice();
  }
);
</script>
